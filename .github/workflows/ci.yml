name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject private runtime artifacts and secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Eiq '(^|/)(\.runtime_token|.*\.sqlite[^/]*|.*chrome.*profile|logs?/)'; then
            echo "Private runtime artifact is tracked"
            exit 1
          fi
          if git grep -I -n -E 'PXYLH|PXYOPS|X-PXY-Orderflow|orderflow_private|data-contract-pxylh' -- . ':!.gitignore' ':!.github/workflows/ci.yml'; then
            echo "Private integration identifier found"
            exit 1
          fi
          if git grep -I -n -E '100\.(6[4-9]|[78][0-9]|9[0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}|[A-Za-z]:\\' -- . ':!.gitignore' ':!.github/workflows/ci.yml'; then
            echo "Internal address or absolute Windows path found"
            exit 1
          fi
          if git grep -I -n -E 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' -- . ':!.gitignore' ':!.github/workflows/ci.yml'; then
            echo "Potential secret found"
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
